name: Risk Monitor - nieuws ophalen en publiceren

on:
  schedule:
    - cron: '10 8,18 * * *'
      timezone: 'Europe/Brussels'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: risk-monitor-deploy
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js configureren
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RSS feeds verwerken
        run: node scripts/update-feed.mjs
      - name: Python configureren voor gratis Nederlandse vertaling
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-translate.txt
      - name: Basistests vertaalmodule
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Argos-modelcache herstellen
        uses: actions/cache@v4
        with:
          path: ~/.cache/risk-monitor-argos-models
          key: risk-monitor-argos-en-nl-v1
      - name: Argos Translate installeren
        continue-on-error: true
        run: python -m pip install -r requirements-translate.txt
      - name: Nieuwe headlines automatisch naar Nederlands vertalen
        env:
          ARGOS_PACKAGE_DIR: /home/runner/.cache/risk-monitor-argos-models
        run: python scripts/translate-feed.py
      - name: Bewaar historiek in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto-news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh RSS signals [skip ci]"
            git push
          fi
      - name: Pages configureren
        uses: actions/configure-pages@v5
      - name: Publicatiepakket maken
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publiceer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
