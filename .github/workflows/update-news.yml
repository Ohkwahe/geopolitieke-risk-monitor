name: Risk Monitor - nieuws ophalen en publiceren

on:
  schedule:
    - cron: '10 8,18 * * *'
      timezone: 'Europe/Brussels'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: risk-monitor-deploy
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Argos reads ARGOS_PACKAGES_DIR (plural). The same location is cached below.
      ARGOS_PACKAGES_DIR: /home/runner/.cache/risk-monitor-argos-models
      ARGOS_DEVICE_TYPE: cpu
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js configureren
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test RSS-verwerking en nieuwsregels
        run: |
          node tests/test_maintenance.mjs
          node tests/test_collector.mjs
          node tests/test_intelligence.mjs
          node tests/test_change_tracking.mjs
          node tests/test_release.mjs
      - name: RSS feeds verwerken
        run: node scripts/update-feed.mjs
      - name: Python configureren voor gratis Nederlandse vertaling
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-translate.txt
      - name: Basistests vertaalmodule
        run: python -m unittest discover -s tests -p 'test_translate.py'
      - name: Argos-modelcache herstellen
        uses: actions/cache@v4
        with:
          path: ~/.cache/risk-monitor-argos-models
          key: risk-monitor-argos-en-nl-${{ runner.os }}-v2
      - name: Argos Translate installeren
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check -r requirements-translate.txt
      - name: Nieuwe headlines automatisch naar Nederlands vertalen
        run: python scripts/translate-feed.py
      - name: Maak automatische ochtend- of avondbriefing
        run: node scripts/prepare-briefing.mjs
      - name: Optionele AI-duiding (alleen expliciet geconfigureerd)
        continue-on-error: true
        env:
          RISK_AI_ENDPOINT: ${{ secrets.RISK_AI_ENDPOINT }}
          RISK_AI_MODEL: ${{ secrets.RISK_AI_MODEL }}
          RISK_AI_KEY: ${{ secrets.RISK_AI_KEY }}
        run: node scripts/ai-enrichment.mjs
      - name: Controleer gegenereerd nieuwsbestand
        run: node scripts/validate-feed.mjs
      - name: Optionele iPhone-signalen via ntfy
        continue-on-error: true
        env:
          RISK_NTFY_TOPIC: ${{ secrets.RISK_NTFY_TOPIC }}
          RISK_NTFY_THRESHOLD: ${{ vars.RISK_NTFY_THRESHOLD }}
        run: node scripts/notify-ntfy.mjs
      - name: Bewaar historiek in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto-news.json
          if [ -f data/notification-state.json ]; then git add data/notification-state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh RSS signals [skip ci]"
            git push
          fi
      - name: Pages configureren
        uses: actions/configure-pages@v5
      - name: Publicatiepakket maken
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publiceer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
